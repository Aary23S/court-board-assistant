[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "court-board-assistant"
version = "0.1.0"
description = "Local court-workflow automation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.2",
    "python-calamine>=0.2.0",
    "pydantic>=2.4.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
